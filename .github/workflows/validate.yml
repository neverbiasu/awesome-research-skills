# No badge in README.md — awesome-list convention allows CI, not advertising it.
name: validate

on:
  push:
    paths: ["data/**", "scripts/**", "README.md", ".github/workflows/validate.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deterministic and offline: schema, uniqueness, description style, category validity,
      # audit-block consistency, and whether README.md is still in sync with data/skills.json.
      # A README that has drifted from its source is a trust claim the list cannot back up.
      - run: python3 scripts/validate.py
