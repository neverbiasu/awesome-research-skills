# Deliberately no status badge in README.md — awesome-list convention allows using CI, but not
# advertising it. See sindresorhus/awesome pull_request_template.md.

name: link-check

on:
  schedule:
    # Weekly checks; reports stay in Actions rather than opening reminder issues.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every link in README.md
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --max-concurrency keeps GitHub from rate-limiting us into false failures, which
          # would train everyone to ignore this job.
          args: >-
            --no-progress
            --max-concurrency 4
            --timeout 30
            --max-retries 3
            --accept 200,206,429
            --exclude-path .github
            README.md
          output: lychee-report.md
          fail: false

      - name: Record link-check report
        if: always()
        run: |
          if [ -f lychee-report.md ]; then
            cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
